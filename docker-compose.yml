version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: gestor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: gestor-auth
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8001"

  catalog-service:
    build:
      context: ./catalog-service
      dockerfile: Dockerfile
    container_name: gestor-catalog
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8002"
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8002"

  sales-service:
    build:
      context: ./sales-service
      dockerfile: Dockerfile
    container_name: gestor-sales
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8003:8003"
    command: >
      sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8003"

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gestor-gateway
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      sales-service:
        condition: service_started
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
